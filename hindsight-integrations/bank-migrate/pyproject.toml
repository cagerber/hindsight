[project]
name = "hindsight-bank-migrate"
version = "0.9.2-baseline"
description = "Reference downstream consumer tool for Hindsight memory daemon"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pyyaml>=6.0,<7",
]

[project.scripts]
hindsight-bank-migrate = "hindsight_bank_migrate.cli:app"
hindsight-bank-migrate-mcp = "hindsight_bank_migrate.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hindsight_bank_migrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "conformance: live-daemon conformance tests (requires HINDSIGHT_DAEMON_URL); excluded from default test runs",
]

[tool.ruff]
line-length = 100
